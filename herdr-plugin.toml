id = "herdr-session-workspace-sync"
name = "Herdr Session Workspace Sync"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Sync agent session titles and latest messages to Herdr sidebars."
platforms = ["macos", "linux"]

[[build]]
command = ["bun", "scripts/install.ts", "--plugin-build"]

[[events]]
on = "workspace.created"
command = ["bun", "src/workspace-refresh.ts"]

[[events]]
on = "workspace.updated"
command = ["bun", "src/workspace-refresh.ts"]

[[events]]
on = "pane.created"
command = ["bun", "src/workspace-refresh.ts"]

[[events]]
on = "pane.exited"
command = ["bun", "src/workspace-refresh.ts"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "src/workspace-refresh.ts"]
